version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0
    container_name: movie_knowledge_graph_db
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./init:/var/lib/neo4j/import
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null --header=\"Authorization: Basic neo4j/your-secure-password\" http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
